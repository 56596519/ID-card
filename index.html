<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>身份证 A4 拼版打印</title>
<link rel="stylesheet" href="css/style.css?v=8" />
<link rel="icon" href="data:," />
</head>
<body>

<header>
  <div class="logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/></svg>
  </div>
  <h1>身份证 A4 拼版打印</h1>
  <span class="sub">自动拉正 · 拼版 · 打印</span>
  <span class="credit">浙江高成内部测试使用 · 作者：By、布鲁托</span>
</header>

<main>
  <div class="panel">
    <div class="engine-status loading" id="engine-status" style="display:none">
      <span class="dot"></span>图像引擎加载中…
    </div>
    <div class="panel-top">
      <div class="group-title">上传照片</div>

      <div>
        <div class="slot-label">人像面（背面）<small>带照片和姓名</small></div>
        <div class="slot" id="slot-back">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            点击或拖拽上传
          </div>
        </div>
        <input type="file" id="file-back" accept="image/*" hidden />
        <div class="rot-row" id="rot-back" style="display:none">
          <span>旋转 <b id="rot-back-val">0°</b></span>
          <span class="rot-btns">
            <button data-side="back" data-d="-90" title="左转90°">↺</button>
            <button data-side="back" data-d="90" title="右转90°">↻</button>
          </span>
        </div>
      </div>

      <div style="margin-top:14px">
        <div class="slot-label">国徽面（正面）<small>带国徽和签发机关</small></div>
        <div class="slot" id="slot-front">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            点击或拖拽上传
          </div>
        </div>
        <input type="file" id="file-front" accept="image/*" hidden />
        <div class="rot-row" id="rot-front" style="display:none">
          <span>旋转 <b id="rot-front-val">0°</b></span>
          <span class="rot-btns">
            <button data-side="front" data-d="-90" title="左转90°">↺</button>
            <button data-side="front" data-d="90" title="右转90°">↻</button>
          </span>
        </div>
      </div>
    </div>

    <div class="panel-bottom">
    <div>
      <div class="group-title">画面调节</div>
      <div class="sliders">
        <div class="row">
          <label>亮度</label>
          <input type="range" id="brightness" min="0" max="100" value="50" />
          <span class="val" id="brightness-val">50</span>
        </div>
        <div class="row">
          <label>锐化</label>
          <input type="range" id="sharpen" min="0" max="100" value="0" />
          <span class="val" id="sharpen-val">0</span>
        </div>
        <p>亮度 50 为正常；照片偏暗时调亮，模糊时加大锐化。</p>
      </div>
    </div>

    <div>
      <div class="btns">
        <button class="primary" id="btn-print" disabled>打印</button>
        <button class="ghost" id="btn-download" disabled>下载 PNG</button>
      </div>
      <button class="reset-btn" id="btn-reset" type="button" title="清空两面照片并复位亮度、锐化，开始下一位">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        重置 · 下一位
      </button>
      <p class="hint" style="margin-top:10px">打印时选 A4、边距「无」、缩放 100%，按真实尺寸输出。</p>
    </div>
    </div>
  </div>

  <div class="preview">
    <div class="a4"><canvas id="a4-canvas"></canvas></div>
  </div>
</main>

<script src="js/app.js?v=6" defer></script>
</body>
</html>
